<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata — Cappuccini Cesena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--sabbia:#E8DCC4;--saio:#8A5A34;--chiaro:#FBF6EC;--testo:#3A2413;--testo-2:#6B4A2E;--accento:#993C1D}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--sabbia);color:var(--testo);
 font-family:"Poppins",-apple-system,BlinkMacSystemFont,sans-serif;font-weight:300;
 display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
.box{max-width:460px}
.occhiello{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accento);
 font-weight:500;margin-bottom:16px}
h1{font-size:clamp(26px,6vw,38px);font-weight:500;line-height:1.2;margin:0 0 14px}
p{color:var(--testo-2);font-size:16px;margin:0 0 28px}
.btn{display:inline-block;padding:13px 28px;border-radius:999px;background:var(--saio);
 color:var(--chiaro);text-decoration:none;font-size:15px;font-weight:500}
</style>
</head>
<body>
<div class="box">
  <div class="occhiello">Errore 404</div>
  <h1>Questa porta non si apre.</h1>
  <p>La pagina che cercavi non esiste, o ha cambiato posto. Le altre sono tutte aperte.</p>
  <a class="btn" href="/">Torna all'ingresso</a>
</div>
</body>
</html>
